<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网页翻译助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <div class="popup-logo">🌐</div>
      <div class="popup-title">
        <h1>网页翻译助手</h1>
        <span class="popup-version">v1.0.0</span>
      </div>
    </div>

    <div class="popup-status">
      <div class="status-item">
        <span class="status-dot" id="translate-status"></span>
        <span>翻译服务</span>
      </div>
      <div class="status-item">
        <span class="status-dot" id="ocr-status"></span>
        <span>OCR服务</span>
      </div>
    </div>

    <div class="popup-actions">
      <button class="action-btn" id="btn-translate-selection">
        <span class="action-icon">📝</span>
        <span class="action-text">翻译选中文字</span>
        <span class="action-shortcut">Ctrl+Shift+T</span>
      </button>
      <button class="action-btn" id="btn-translate-page">
        <span class="action-icon">📄</span>
        <span class="action-text">翻译整个页面</span>
        <span class="action-shortcut">Ctrl+Shift+P</span>
      </button>
      <button class="action-btn" id="btn-summarize">
        <span class="action-icon">📋</span>
        <span class="action-text">总结页面内容</span>
        <span class="action-shortcut">Ctrl+Shift+S</span>
      </button>
    </div>

    <div class="popup-settings">
      <div class="setting-row">
        <label for="source-lang">源语言</label>
        <select id="source-lang">
          <option value="auto">自动检测</option>
          <option value="en">English</option>
          <option value="zh">中文</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
          <option value="ru">Русский</option>
        </select>
      </div>
      <div class="setting-row">
        <label for="target-lang">目标语言</label>
        <select id="target-lang">
          <option value="zh">中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
          <option value="ru">Русский</option>
        </select>
      </div>
    </div>

    <div class="popup-toggles">
      <div class="toggle-row">
        <span>文字翻译</span>
        <label class="toggle-switch">
          <input type="checkbox" id="toggle-text-translate" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <span>图片翻译</span>
        <label class="toggle-switch">
          <input type="checkbox" id="toggle-image-translate" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <span>鼠标手势</span>
        <label class="toggle-switch">
          <input type="checkbox" id="toggle-gesture" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <span>右键菜单</span>
        <label class="toggle-switch">
          <input type="checkbox" id="toggle-context-menu" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <div class="popup-footer">
      <button class="footer-btn" id="btn-settings">⚙️ 设置</button>
      <button class="footer-btn" id="btn-history">📜 历史</button>
    </div>
  </div>

  <script src="../utils/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
